[global]
# IEEE1588-2008, IPv4 UDP, software timestamping: master uses CLOCK_REALTIME/UTC.
# Keep software mode; hardware mode needs explicit PHC/TAI-to-UTC handling.
network_transport UDPv4
# 端到端延迟测量，适配机内单交换机直连雷达的网段。
delay_mechanism E2E
time_stamping software
# PTP 域号，主从设备必须一致，避免与外部时钟域混用。
domainNumber 0
# 两步时钟：Follow_Up 报文携带 Sync 的精确发送时刻。
twoStepFlag 1
# BMC 选主优先级，数值越小越优先。
priority1 100
priority2 100
# clockClass 248：应用专用、非卫星溯源的普通时钟。
clockClass 248
# Announce 间隔 2^0=1 s，Sync 间隔 2^-3=125 ms，适合机载局域网。
logAnnounceInterval 0
logSyncInterval -3
# 日志级别 6（info），便于台架核对同步状态。
logging_level 6
